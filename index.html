<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - Vector Problem</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Kanit:wght@300;400;500&display=swap"
        rel="stylesheet">
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --user-msg: #3b82f6;
            --ai-msg: #334155;
            --border: #334155;
            --header-bg: #0f172a;
            --btn-bg: #2d3748;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navbar */
        .header {
            height: 50px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .header-btn {
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .header-btn:hover {
            background: #2d3748;
            border-color: #4a5568;
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Panel Common Styles */
        .panel {
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border-right: 1px solid var(--bg-color);
            overflow: hidden;
        }

        .panel-header {
            padding: 0.75rem 1rem;
            background: #1e293b;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
        }

        /* Left Panel - Problem Description */
        .left-panel {
            flex: 0 0 30%;
            overflow-y: auto;
        }

        .problem-content {
            padding: 1.5rem;
            line-height: 1.6;
        }

        .problem-title {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        .difficulty-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .diff-easy {
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .diff-medium {
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }

        .diff-hard {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .problem-section {
            margin-top: 1.5rem;
        }

        .problem-section h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .constraints-box {
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }

        /* Middle Panel - Code Editor */
        .middle-panel {
            flex: 1;
            border-right: 1px solid var(--bg-color);
        }

        #editor-container {
            flex: 1;
            width: 100%;
        }

        .editor-footer {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: var(--panel-bg);
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        /* Right Panel - AI Chat (Pushing Drawer) */
        .right-panel {
            width: 0;
            overflow: hidden;
            background: var(--panel-bg);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: none;
            position: relative;
        }

        .right-panel.open {
            width: var(--ai-width, 450px);
            border-left: 1px solid var(--border);
            overflow: visible;
        }

        .right-panel-inner {
            width: var(--ai-width, 450px);
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .right-panel.is-resizing {
            transition: none;
        }

        .resizer {
            width: 6px;
            cursor: col-resize;
            position: absolute;
            left: -3px;
            top: 0;
            bottom: 0;
            z-index: 10;
            background: transparent;
            transition: background 0.2s;
        }

        .resizer:hover,
        .right-panel.is-resizing .resizer {
            background: var(--primary);
        }

        .chat-history {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Chat Messages Styles */
        .message {
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.ai {
            align-self: flex-start;
        }

        .bubble {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .user .bubble {
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 0;
        }

        .ai .bubble {
            background: var(--ai-msg);
            border-bottom-left-radius: 0;
            border: 1px solid var(--border);
        }

        .sender-name {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin: 0 4px;
        }

        /* Markdown in Chat */
        .bubble pre {
            background: #0d1117;
            padding: 0.75rem;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid #30363d;
            margin: 0.5rem 0;
        }

        .bubble code {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 4px;
            border-radius: 3px;
        }

        .bubble p {
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        .bubble p:last-child {
            margin-bottom: 0;
        }

        /* Chat Input Area */
        .chat-input-area {
            padding: 1rem;
            background: var(--panel-bg);
            border-top: 1px solid var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-modes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 8px;
        }

        #chatInput {
            flex: 1;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 6px;
            font-family: inherit;
            resize: none;
            height: 40px;
            outline: none;
        }

        #chatInput:focus {
            border-color: var(--primary);
        }

        .btn-send-chat {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-send-chat:disabled {
            background: var(--border);
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>🤖 AI Tutor</h1>
        <div class="settings">
            <input type="file" id="pdfUploadInput" accept=".pdf" style="display: none;">
            <button class="header-btn" id="uploadBtn">📄 Upload PDF</button>
            <select id="questionSelect">
                <option value="">Loading questions...</option>
            </select>
            <button class="header-btn" id="toggleAiBtn"
                style="background: var(--primary); color: white; border-color: var(--primary);">✨ AI</button>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">

        <!-- Left Panel: Problem Description -->
        <div class="panel left-panel">
            <div class="panel-header">📄 Description</div>
            <div class="problem-content" id="problemContent">
                <div style="text-align: center; margin-top: 50px; color: #64748b;">No problem selected.</div>
            </div>
        </div>

        <!-- Middle Panel: Code Editor -->
        <div class="panel middle-panel">
            <div class="panel-header" id="editorHeader">
                &lt;/&gt; Code
                <span style="flex:1"></span>
                <span style="font-size: 0.75rem; font-weight: normal;">Python 3</span>
            </div>
            <div id="editor-container"></div>

            <div class="editor-footer">
                <!-- Using Analyze Mode directly from Editor -->
                <button class="btn-submit" id="btnAnalyzeCode" title="Send code to AI for Analysis">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                    Analyze Code
                </button>
                <button class="btn-submit" id="btnCompareCode" style="background:#f59e0b;"
                    title="Compare Editor Code vs Last Version">
                    ⚖️ Compare
                </button>
            </div>
        </div>

        <!-- Right Panel: AI Chat -->
        <div class="panel right-panel">
            <div class="resizer" id="aiResizer"></div>
            <div class="right-panel-inner">
                <div class="panel-header" style="justify-content: space-between;">
                    <span>✨ AI Assistant (Leet)</span>
                    <button id="closeAiBtn"
                        style="background: transparent; border: none; color: var(--text-sub); cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;">×</button>
                </div>

                <div class="chat-history" id="chatHistory">
                    <div class="message ai">
                        <span class="sender-name">AI Tutor</span>
                        <div class="bubble">
                            สวัสดีครับ! ผมคือ AI Tutor 🎓 <br>
                            - หากมีคำถาม กดปุ่ม <b>Hint</b> ด้านล่างแล้วพิมพ์ถามได้เลย<br>
                            - หรือสามารถเขียนโค้ดตรงกลางแล้วกดปุ่ม <b>Analyze Code</b> ให้ผมช่วยรีวิวได้ครับ!
                        </div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <div class="chat-modes" id="modeSelector">
                        <button class="mode-btn active" data-mode="hint">🙋‍♂️ Hint (General Q&A)</button>
                        <!-- other modes are handled implicitly via UI buttons -->
                    </div>
                    <div class="chat-input-wrapper">
                        <textarea id="chatInput" placeholder="Ask a question about the problem..."></textarea>
                        <button class="btn-send-chat" id="sendBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Monaco Editor Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script>
        // Setup Highlight.js for marked text
        marked.setOptions({
            highlight: function (code, lang) {
                const validLanguage = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(validLanguage, code).value;
            }
        });

        // UI Elements
        const questionSelect = document.getElementById('questionSelect');
        const problemContent = document.getElementById('problemContent');
        const rightPanel = document.querySelector('.right-panel');
        const toggleAiBtn = document.getElementById('toggleAiBtn');
        const closeAiBtn = document.getElementById('closeAiBtn');

        // Sliding Panel Logic
        function openAiPanel() { rightPanel.classList.add('open'); }
        function closeAiPanel() { rightPanel.classList.remove('open'); }
        toggleAiBtn.addEventListener('click', () => rightPanel.classList.toggle('open'));
        closeAiBtn.addEventListener('click', closeAiPanel);

        // Resizer Logic
        const aiResizer = document.getElementById('aiResizer');
        let isResizing = false;
        aiResizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            rightPanel.classList.add('is-resizing');
            document.body.style.cursor = 'col-resize';
            e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            let newWidth = window.innerWidth - e.clientX;
            if (newWidth < 300) newWidth = 300;
            if (newWidth > window.innerWidth * 0.7) newWidth = window.innerWidth * 0.7; // limit to 70% of screen
            document.documentElement.style.setProperty('--ai-width', `${newWidth}px`);
        });
        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                rightPanel.classList.remove('is-resizing');
                document.body.style.cursor = '';
            }
        });

        const chatHistory = document.getElementById('chatHistory');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const btnAnalyzeCode = document.getElementById('btnAnalyzeCode');
        const btnCompareCode = document.getElementById('btnCompareCode');

        // State
        let currentQuestionId = null;
        let myEditor = null;
        let previousCode = ""; // Stored for comparison mode

        // Monaco Editor Initialization
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            myEditor = monaco.editor.create(document.getElementById('editor-container'), {
                value: "class Solution:\n    def solve(self):\n        pass",
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false },
                fontSize: 14,
                fontFamily: "'Courier New', monospace"
            });
        });

        // Initialize App
        async function loadQuestions() {
            try {
                const res = await fetch('/api/questions');
                const questions = await res.json();

                questionSelect.innerHTML = '';
                questions.forEach(q => {
                    const opt = document.createElement('option');
                    opt.value = q.id;
                    opt.textContent = `${q.id.toUpperCase()}: ${q.title}`;
                    questionSelect.appendChild(opt);
                });

                if (questions.length > 0) {
                    questionSelect.value = questions[0].id;
                    loadProblemDetails(questions[0].id);
                }
            } catch (err) {
                console.error("Failed to load questions", err);
            }
        }

        async function loadProblemDetails(qId) {
            currentQuestionId = qId;
            try {
                const res = await fetch(`/api/questions/${qId}`);
                if (!res.ok) throw new Error("Failed to load details");
                const data = await res.json();

                let diffClass = 'diff-easy';
                if (data.difficulty.toLowerCase() === 'medium') diffClass = 'diff-medium';
                if (data.difficulty.toLowerCase() === 'hard') diffClass = 'diff-hard';

                problemContent.innerHTML = `
                    <h2 class="problem-title">${data.title}</h2>
                    <span class="difficulty-badge ${diffClass}">${data.difficulty}</span>
                    
                    <div class="problem-section">
                        ${marked.parse(data.description)}
                    </div>

                    <div class="problem-section">
                        <h3>Constraints:</h3>
                        <div class="constraints-box">
                            ${data.constraints.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                    
                    <div class="problem-section">
                        <div style="font-size:0.85rem; color:#94a3b8; display:flex; justify-content:space-between; margin-top: 20px;">
                            <span>⏱ Time Limit: ${data.time_limit} ms</span>
                            <span>💾 Memory Limit: ${data.memory_limit} MB</span>
                        </div>
                    </div>
                `;
            } catch (err) {
                problemContent.innerHTML = `<div style="color:red">Failed to load problem details.</div>`;
            }
        }

        questionSelect.addEventListener('change', (e) => {
            loadProblemDetails(e.target.value);
        });

        loadQuestions();

        // Chat & AI Integration
        function appendMessage(sender, content, isMarkdown = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            const nameSpan = document.createElement('span');
            nameSpan.className = 'sender-name';
            nameSpan.textContent = sender === 'user' ? 'คุณ (นักศึกษา)' : 'AI Tutor';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';

            if (isMarkdown) bubbleDiv.innerHTML = marked.parse(content);
            else bubbleDiv.textContent = content;

            msgDiv.appendChild(nameSpan);
            msgDiv.appendChild(bubbleDiv);
            chatHistory.appendChild(msgDiv);

            chatHistory.scrollTop = chatHistory.scrollHeight;
            return bubbleDiv;
        }

        async function requestAIStream(endpoint, payload, userDisplayMsg) {
            if (!currentQuestionId) return;
            payload.question_id = currentQuestionId;

            appendMessage('user', userDisplayMsg, false);
            const btnStates = disableInputs(true);

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const bubbleDiv = appendMessage('ai', '', true);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let aiResponseContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    aiResponseContent += decoder.decode(value, { stream: true });
                    bubbleDiv.innerHTML = marked.parse(aiResponseContent);
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                }
            } catch (error) {
                appendMessage('ai', `❌ Connection Error: ${error.message}`);
            } finally {
                disableInputs(false, btnStates);
            }
        }

        function disableInputs(disabled, states = {}) {
            if (disabled) {
                const s = { sendBtn: sendBtn.disabled, btnA: btnAnalyzeCode.disabled, btnC: btnCompareCode.disabled };
                sendBtn.disabled = true;
                btnAnalyzeCode.disabled = true;
                btnCompareCode.disabled = true;
                return s;
            } else {
                sendBtn.disabled = false;
                btnAnalyzeCode.disabled = false;
                btnCompareCode.disabled = false;
            }
        }

        // Action: Hint (from chat box)
        sendBtn.addEventListener('click', () => {
            const text = chatInput.value.trim();
            if (!text) return;
            chatInput.value = '';
            requestAIStream('/api/hint', { student_question: text }, `💬 ถาม: ${text}`);
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
        });

        // Action: Analyze Code (from editor)
        btnAnalyzeCode.addEventListener('click', () => {
            if (!myEditor) return;
            openAiPanel();
            const code = myEditor.getValue();
            previousCode = code; // Save for future comparison
            requestAIStream('/api/analyze', { student_code: code }, `🔍 [Analyze Code]\nส่งโค้ดความยาว ${code.length} ตัวอักษรไปให้ AI รีวิว`);
        });

        // Action: Compare Code
        btnCompareCode.addEventListener('click', () => {
            if (!myEditor) return;
            openAiPanel();
            const currentCode = myEditor.getValue();
            if (!previousCode || previousCode === currentCode) {
                alert("Please analyze a previous version of code first, or write a new one to compare!");
                return;
            }
            requestAIStream('/api/compare', {
                old_code: previousCode,
                new_code: currentCode
            }, `⚖️ [Compare Code]\nเทียบบทแก้ไขล่าสุดกับผลงานเดิม`);
            previousCode = currentCode; // update
        });

        // PDF Upload
        const uploadBtn = document.getElementById('uploadBtn');
        const pdfUploadInput = document.getElementById('pdfUploadInput');

        uploadBtn.addEventListener('click', () => pdfUploadInput.click());

        pdfUploadInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            appendMessage('user', `กำลังอัปโหลดไฟล์: ${file.name}`);
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/ingest', { method: 'POST', body: formData });
                if (!response.ok) throw new Error("Upload Failed");
                const data = await response.json();
                appendMessage('ai', `✅ เรียนรู้ไฟล์สำเร็จ: **${data.filename || file.name}**`, true);
            } catch (error) {
                appendMessage('ai', `❌ เกิดข้อผิดพลาด: ${error.message}`);
            }
        });
    </script>
</body>

</html>
